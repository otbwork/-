<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1020" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="500" height="500" rx="112" fill="url(#bg)"/>

  <!-- speech bubble centered -->
  <g filter="url(#soft)" transform="translate(0,18)">
    <path d="M140 110
             h220
             a56 56 0 0 1 56 56
             v128
             a56 56 0 0 1 -56 56
             h-100
             l-54 50
             v-50
             h-66
             a56 56 0 0 1 -56 -56
             v-128
             a56 56 0 0 1 56 -56 z"
          fill="#FFFFFF"/>
  </g>

  <!-- open 'c' mark inside bubble -->
  <path d="M308 178
           a84 84 0 1 0 0 120"
        fill="none" stroke="#4338CA" stroke-width="38" stroke-linecap="round"/>
  <!-- accent pen-tip dot -->
  <circle cx="322" cy="238" r="22" fill="url(#accent)"/>
</svg>

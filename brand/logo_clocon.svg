<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1020" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="400" rx="48" fill="url(#bg)"/>

  <!-- mark on the left -->
  <g transform="translate(70,92)">
    <g filter="url(#soft)">
      <path d="M30 0
               h150
               a40 40 0 0 1 40 40
               v92
               a40 40 0 0 1 -40 40
               h-72
               l-38 36
               v-36
               h-40
               a40 40 0 0 1 -40 -40
               v-92
               a40 40 0 0 1 40 -40 z"
            fill="#FFFFFF"/>
    </g>
    <path d="M150 48 a58 58 0 1 0 0 84" fill="none" stroke="#4338CA" stroke-width="26" stroke-linecap="round"/>
    <circle cx="160" cy="90" r="15" fill="url(#accent)"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="232" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="150" font-weight="800" letter-spacing="2" fill="#FFFFFF">clocon</text>
  <text x="364" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="34" font-weight="500" letter-spacing="8" fill="#C7D2FE">WRITING ・ DESIGN STUDIO</text>
</svg>
